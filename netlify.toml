[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_DEMO_MODE = "false"
  VITE_PUBLIC_SITE_URL = "https://rcm-invitaciones.netlify.app"
  VITE_SUPABASE_URL = "https://gwngxpzyfmghierwoujr.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_7UcGeXtzYpV3MlDjC071AQ_EdAOu-C0"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
